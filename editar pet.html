!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Pet - Editar Pet</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>


<header>
    <h1>Hotel Pet</h1>
    <p>Editar informações do Pet</p>
</header>



<main>

<div class="conteudo">


<h2>Editar Pet</h2>


<form class="formulario">


<label>Nome do Pet</label>
<input type="text" value="Rex">


<label>Tipo do animal</label>

<select>
    <option>Cachorro</option>
    <option>Gato</option>
</select>


<label>Raça</label>
<input type="text" value="Golden Retriever">


<label>Tamanho</label>

<select>
    <option>Grande</option>
    <option>Médio</option>
    <option>Pequeno</option>
</select>



<label>Proprietário</label>

<input type="text" value="João Silva">



<label>Alterar foto</label>

<input type="file">



<button class="botao">
Salvar alterações
</button>


</form>


</div>


</main>


</body>

</html>
